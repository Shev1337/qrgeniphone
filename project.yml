name: QRGen
options:
  bundleIdPrefix: com.example
targets:
  QRGen:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [QRGen]
    scheme:
      testTargets: [QRGenUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.qrgen
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: QRArest
        INFOPLIST_KEY_NSCameraUsageDescription: "Для сканирования QR-кодов необходим доступ к камере."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "9"
  QRGenUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources: [QRGenUITests]
    dependencies:
      - target: QRGen
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: QRGen
