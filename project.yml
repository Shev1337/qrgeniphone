name: QRGen
options:
  bundleIdPrefix: com.example
targets:
  QRGen:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [QRGen]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.qrgen
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: QR-генератор
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
