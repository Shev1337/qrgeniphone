name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  test-scan:
    runs-on: macos-15-intel
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Test QR scan confirmation
        run: |
          device_id="$(xcrun simctl list devices available -j | jq -er '[.devices | to_entries[] | select(.key | contains(".iOS-")) | .value[] | select(.name | startswith("iPhone"))][0].udid')"
          xcodebuild -project QRGen.xcodeproj -scheme QRGen -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" -parallel-testing-enabled NO \
            -derivedDataPath build-tests -resultBundlePath ScanFlowTests.xcresult test
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Check ticket history
        run: |
          swiftc QRGen/TicketData.swift Tests/TicketHistoryChecks.swift -o "$RUNNER_TEMP/ticket-history-checks"
          "$RUNNER_TEMP/ticket-history-checks"
      - name: Check still frame recognition
        run: |
          swiftc QRGen/TicketData.swift QRGen/ScanPhotoRecovery.swift Tests/ScanPhotoChecks.swift -o "$RUNNER_TEMP/scan-photo-checks"
          "$RUNNER_TEMP/scan-photo-checks"
      - name: Build
        run: |
          xcodebuild -project QRGen.xcodeproj -scheme QRGen -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/QRGen.app Payload/
          zip -r QRGen.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: QRGen-ipa
          path: QRGen.ipa
